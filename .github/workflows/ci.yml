name: ci
# D-CEO-20261024-02 CI diet: one run per commit (push to main, or PR events), drafts skipped,
# superseded runs cancelled, docs-only changes skipped, one shared `npm ci` for the gate.
# Work PRs open as Draft and are marked Ready only at the gate SHA (ready_for_review triggers the run).
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md', 'docs/**']
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    # Replaces unit + slow + release-globals (chromium) + release-html: same commands, one checkout, one `npm ci`.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: npm ci
        run: npm ci
      - name: Unit tests (npm test; includes sync-economy --check)
        run: npm test
      - name: Slow suites (npm run test:slow; vendor pins + 100-seed seller-variance TS-vs-Python parity, PR #19)
        run: npm run test:slow
      - name: Release build (npm run build; sync-economy --check, tsc --noEmit, vite build, check-release-build dist)
        run: npm run build
      - name: Install browser (chromium)
        run: test -x /usr/bin/google-chrome
      - name: Release globals allowlist (chromium)
        # Required (QA rc1): release window globals must be exactly eggfarmExportTelemetry. Serves dist/ from the build above.
        run: npm run check-globals -- chromium
      - name: Single-file release html (build:html runs check-release-build on dist-html/egg-farm.html)
        # PR #13 / Code Reviewer M1: build id = HEAD, window globals = eggfarmExportTelemetry only, no external refs / sourcemaps / QA hooks.
        run: npm run build:html
      - name: check-release-build --build-id (expected id = BUILD_PREFIX + this commit)
        run: |
          prefix=$(sed -n "s/^export const BUILD_PREFIX = '\(.*\)';/\1/p" scripts/build-id.ts)
          node scripts/check-release-build.mjs dist-html/egg-farm.html --build-id "$prefix+$(git rev-parse --short HEAD)"
      - name: Upload egg-farm-html artifact
        uses: actions/upload-artifact@v4
        with: { name: egg-farm-html, path: dist-html/egg-farm.html }
  release-globals:
    # Required (QA rc1): release window globals must be exactly eggfarmExportTelemetry, in every engine.
    # Chromium runs inside `gate`; Firefox/WebKit only on main, rc/* pushes, and PRs from rc/* branches (e.g. #67).
    needs: gate
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft) &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/rc/') || startsWith(github.head_ref, 'rc/'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [webkit, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - name: npm ci
        run: npm ci
      - name: Install browser (${{ matrix.engine }})
        run: npx playwright-core install --with-deps ${{ matrix.engine }}
      - name: Release build (includes check-release-build)
        run: npm run build
      - name: Release globals allowlist (${{ matrix.engine }})
        run: npm run check-globals -- ${{ matrix.engine }}
