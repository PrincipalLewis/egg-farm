name: ci
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: economy.csv copy matches product/ (skipped when product/ is absent)
        run: npm run check-economy-copy
      - run: npm test
