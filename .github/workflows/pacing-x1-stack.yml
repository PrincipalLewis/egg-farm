name: pacing-x1-stack
# v5 manifest row 1: CI check `pacing-x1-stack` (economy §13.2a AC-X1, sizing §15b; HoE owns the check).
# The whole bot-modelled M5.0 stack plus each flag's off/on delta, seeds 1-200, against Econ's §13.2a prediction table
# (tests/fixtures/x1/pred-13.2a-e4369888.csv): blocks-merge=Y rows fail the check, N rows warn. G5-P pause rows stay out
# until Features delivers the driver (X1 note, D-HOE-20261029-05). Data source: X1_DATA in tests/pacing-x1/source.ts.
# Not a required check: branch protection is HoE's call after Vadim's go on M5 (§15b). Same triggers, path filter and draft
# skip as ci.yml. The three profile shards run in parallel; the job named `pacing-x1-stack` is the status check.
on:
  push:
    branches: [main]
    paths: ['**', '!**/*.md', '!docs/**', 'vendor/**', 'README.md', 'public/**', 'tests/**']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ['**', '!**/*.md', '!docs/**', 'vendor/**', 'README.md', 'public/**', 'tests/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  shard:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: pacing-x1-stack shard (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        profile: [optimal, seller15, casual]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20, cache: npm }
      - name: npm ci
        run: npm ci
      - name: Shard ${{ matrix.profile }} (seeds 1-200, T 4000, none / N / H + flag toggles)
        run: npx vite-node scripts/pacing-x1-stack.ts -- shard --profile ${{ matrix.profile }} --out x1-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: 'x1-shard-${{ matrix.profile }}', path: x1-out/, retention-days: 14 }
  pacing-x1-stack:
    needs: shard
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 20, cache: npm }
      - name: npm ci
        run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { pattern: 'x1-shard-*', path: x1-out, merge-multiple: true }
      - name: Verdict vs §13.2a (Y rows fail, N rows warn; a missing shard fails)
        run: npx vite-node scripts/pacing-x1-stack.ts -- verdict --in x1-out --out x1-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with: { name: x1-verdict, path: x1-out/, retention-days: 14 }
